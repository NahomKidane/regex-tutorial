<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regex Tutorial & Reference</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>🔍 Regex Tutorial & Reference</h1>
        <p>Learn, explore, and practice regular expressions</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('learn')">📚 Learn</button>
        <button class="tab-btn" onclick="switchTab('reference')">📖 Reference</button>
        <button class="tab-btn" onclick="switchTab('practice')">✏️ Practice</button>
        <button class="tab-btn" onclick="switchTab('realworld')">🌍 Real-World</button>
    </div>

    <div id="learn" class="mode active">
        <div class="container">
            <div class="two-col">
                <div class="sidebar">
                    <div class="lesson-list" id="lessonList"></div>
                </div>
                <div class="box">
                    <div id="lessonContent"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="reference" class="mode">
        <div class="container">
            <div class="box">
                <h2>Pattern Reference</h2>
                <div class="pattern-cats" id="patternCats"></div>
                <div class="grid" id="patternGrid"></div>
            </div>
        </div>
    </div>

    <div id="practice" class="mode">
        <div class="container">
            <div class="box">
                <h2>Practice Exercises</h2>
                <div class="grid" id="practiceGrid"></div>
            </div>
        </div>
    </div>

    <div id="realworld" class="mode">
        <div class="container">
            <div class="box">
                <h2>Real-World Patterns</h2>
                <div class="grid" id="realworldGrid"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="box">
            <h2>🎮 Playground</h2>
            <label>Regex Pattern:</label>
            <input type="text" id="pattern" value="\w+" />
            
            <label>Test Text:</label>
            <textarea id="testText">Hello World 123</textarea>
            
            <label>Flags:</label>
            <div class="checkbox-group">
                <div class="checkbox-item">
                    <input type="checkbox" id="flagG" checked />
                    <label for="flagG">Global (g)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="flagI" />
                    <label for="flagI">Case-insensitive (i)</label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" id="flagM" />
                    <label for="flagM">Multiline (m)</label>
                </div>
            </div>
            
            <div class="results">
                <div id="results">
                    <div class="count">Found 0 matches</div>
                    <div class="highlighted">Hello World 123</div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
