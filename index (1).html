<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regex Workshop — AI 102</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ════════════════════════════════════════════
       HEADER
       ════════════════════════════════════════════ -->
  <header class="header">
    <div class="header-brand">
      <div class="icon">.*</div>
      <div>
        <h1>Regex Workshop</h1>
        <div class="subtitle">AI 102 — Pattern Matching for Text Analysis</div>
      </div>
    </div>

    <nav class="mode-tabs">
      <button class="mode-tab active" data-mode="learn">Learn</button>
      <button class="mode-tab" data-mode="reference">Reference</button>
      <button class="mode-tab" data-mode="challenge">Challenges</button>
      <button class="mode-tab" data-mode="cheatsheet">Cheat Sheet</button>
    </nav>
  </header>


  <!-- ════════════════════════════════════════════
       MAIN SPLIT LAYOUT
       ════════════════════════════════════════════ -->
  <div class="main">

    <!-- Left: Content (switches with tabs) -->
    <div class="content-panel">
      <div id="panel-learn"      class="panel-section active"></div>
      <div id="panel-reference"  class="panel-section"></div>
      <div id="panel-challenge"  class="panel-section"></div>
      <div id="panel-cheatsheet" class="panel-section"></div>
    </div>

    <!-- Right: Playground (always visible) -->
    <div class="playground-panel" id="playground">
      <h2>Regex Playground</h2>

      <div>
        <div class="pg-label">Pattern</div>
        <input type="text" class="pg-input" id="pgPattern"
               value="\w+" spellcheck="false" autocomplete="off">
      </div>

      <div>
        <div class="pg-label">Test Text</div>
        <textarea class="pg-textarea" id="pgText"
                  spellcheck="false">Hello World 123</textarea>
      </div>

      <div>
        <div class="pg-label">Flags</div>
        <div class="flags-row">
          <label class="flag-toggle">
            <input type="checkbox" id="flagG" checked>
            <span class="flag-letter">g</span>
            <span class="flag-label">global</span>
          </label>
          <label class="flag-toggle">
            <input type="checkbox" id="flagI">
            <span class="flag-letter">i</span>
            <span class="flag-label">case</span>
          </label>
          <label class="flag-toggle">
            <input type="checkbox" id="flagM">
            <span class="flag-letter">m</span>
            <span class="flag-label">multi</span>
          </label>
        </div>
      </div>

      <div>
        <div class="pg-label">Results</div>
        <div class="results-area" id="pgResults">
          <span class="pg-placeholder">Type a pattern to see matches…</span>
        </div>
      </div>
    </div>

  </div>


  <!-- Mobile playground toggle -->
  <button class="mobile-pg-toggle" id="mobileToggle"
          title="Open Playground">&#9654;</button>
  <div class="mobile-pg-overlay" id="mobileOverlay"></div>


  <!-- ════════════════════════════════════════════
       SCRIPTS  (data first, then logic)
       ════════════════════════════════════════════ -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
